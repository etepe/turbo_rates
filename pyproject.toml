[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rates-engine"
version = "0.3.0"
description = "Turkish Lira OIS curve engine — bootstrap, scenario, comparison, FX IO/CLI/app"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Erdinc"}]
keywords = ["finance", "fixed-income", "ois", "curve", "bootstrap"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "holidays>=0.42",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-pyyaml",
    "pandas-stubs",
    "hypothesis>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
rates = "rates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# mypy: strict across the full rates package (core, io, app, cli).
# Phase 5 extended scope from {core,io} to the whole package once app + cli
# were ready and proven strict-clean.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/rates"]
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["holidays.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts in tests are fine

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "phase1: Phase 1 foundation tests",
    "phase2: Phase 2 curve & bootstrap tests",
    "phase3: Phase 3 scenario & report tests",
    "phase4: Phase 4 io & schemas tests",
    "phase5: Phase 5 integration tests",
    "phase6: Phase 6 hardening — property-based invariants (Hypothesis)",
    "phase7: Phase 7 V2 FX layer (scaffold; most bodies deferred to V2)",
    "phase8: Phase 8 v0.3.0 FX IO/CLI/app integration",
]
