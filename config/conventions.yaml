# Market conventions for rates-engine.
# Loaded by rates.core.conventions.Conventions.load() at pipeline start.
# Pass the resulting Conventions object explicitly through every module — no globals.

# ---------------------------------------------------------------------------
# Per-currency OIS conventions.
# Add a new currency block (USD, EUR, ...) when introducing it.
# ---------------------------------------------------------------------------
ois_conventions:
  TRY:
    day_count: Act/360                       # OIS swap accrual basis
    business_day_convention: modified_following  # how to roll non-business pillar dates
    calendar: TR                             # HolidayCalendar.for_currency('TR')
    payment:
      default_frequency: annual              # >1Y pillars use annual coupons
      bullet_until: 1Y                       # <=1Y degenerates to single bullet payment
  # USD/EUR added for V2 FX layer (rates.fx). Consumed unchanged by bootstrap_curve.
  USD:
    day_count: Act/360
    business_day_convention: modified_following
    calendar: US
    payment:
      default_frequency: annual
      bullet_until: 1Y
  EUR:
    day_count: Act/360
    business_day_convention: modified_following
    calendar: EU
    payment:
      default_frequency: annual
      bullet_until: 1Y

# ---------------------------------------------------------------------------
# FX conventions (V2 — rates.fx). Per-pair quote and settlement metadata.
# Loaded by rates.fx.conventions; rates.core.conventions ignores this block.
# ---------------------------------------------------------------------------
fx_conventions:
  USDTRY:
    quote_convention: direct        # TRY per 1 USD
    spot_lag_days: 1                # T+1 spot
    settlement_calendars: [US, TR]  # spot must be a business day in both
    forward_point_scale: 10000      # quoted pips = points * scale
  EURTRY:
    quote_convention: direct
    spot_lag_days: 2
    settlement_calendars: [EU, TR]
    forward_point_scale: 10000

# ---------------------------------------------------------------------------
# TLREF index basis (separate from OIS).
# Daily TLREF index in core.scenario uses this day-count for compounding.
# ---------------------------------------------------------------------------
tlref_convention:
  day_count: Act/365

# ---------------------------------------------------------------------------
# Spread reporting (market vs scenario comparison, F-012).
# Common basis used to express both rates so the spread is meaningful.
# ---------------------------------------------------------------------------
spread_reporting:
  day_count: Act/365
